[package]
name = "feather"
version = "0.4.0"
description = "Feather : un navigateur léger en Rust (tao + wry)"
edition = "2024"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0.154"
tao = "0.37.1"
url = "2.5.8"
wry = "0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "block2", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController"] }
# Effet de verre (flou du bureau derrière la fenêtre).
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# Effet Mica ou Acrylic (verre) sous Windows 11.
window-vibrancy = "0.8"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# Exécutable léger : optimisé pour la taille, sans symboles de débogage.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
