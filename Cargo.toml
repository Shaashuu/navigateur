[package]
name = "feather"
version = "0.1.5"
description = "Feather 0.1 : un navigateur léger en Rust (tao + wry)"
edition = "2024"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
url = "2.5.8"
wry = "0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# Exécutable léger : optimisé pour la taille, sans symboles de débogage.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
