[package]
name = "feather"
version = "0.5.7"
description = "Feather : un navigateur léger en Rust (tao + wry)"
edition = "2024"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
# Vérification des signatures des mises à jour (Ed25519, sans autre dépendance).
ed25519-compact = { version = "2", default-features = false }
serde_json = "1.0.154"
tao = "0.37.1"
url = "2.5.8"
wry = "0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "block2", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSPopover"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSArray", "NSData", "NSDictionary", "NSURL", "NSSet", "NSEnumerator", "NSGeometry", "NSDate", "NSURLRequest"] }
objc2-photos = { version = "0.3", default-features = false, features = ["std", "block2", "PHPhotoLibrary", "PHChangeRequest", "PHAssetChangeRequest", "PHAssetCreationRequest", "PhotosTypes", "dispatch2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKNavigation", "WKSnapshotConfiguration", "WKWebExtension", "WKWebExtensionAction", "WKWebExtensionContext", "WKWebExtensionController", "WKWebExtensionControllerDelegate", "WKWebExtensionMatchPattern", "WKWebExtensionPermission", "WKWebExtensionTab", "WKWebExtensionTabConfiguration", "WKWebExtensionWindow", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Ole"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# Exécutable léger : optimisé pour la taille, sans symboles de débogage.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
