<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<title>Feather</title>
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #8a8a8e;
    --line: #e2e0da;
    --accent: #5b5bd6;
    --accent-soft: #e6e6fb;
    --danger: #e5484d;
    --shadow: 0 6px 24px rgba(0, 0, 0, .10);
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --surface: #222226;
    --text: #ececef;
    --muted: #7d7d85;
    --line: #34343a;
    --accent: #8f8ff5;
    --accent-soft: #2c2c4a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #17171a;
      --surface: #222226;
      --text: #ececef;
      --muted: #7d7d85;
      --line: #34343a;
      --accent: #8f8ff5;
      --accent-soft: #2c2c4a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg { display: block; }

  /* Colonne de gauche (56 px, voir ui.rs) : paramètres, recherche, onglets */
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 56px;
    display: flex; flex-direction: column; align-items: center; padding: 12px 0;
  }
  #top { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #middle {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .round {
    width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center;
    color: var(--muted); font-size: 18px;
  }
  .round:hover { background: var(--accent-soft); color: var(--text); }
  .round:disabled { opacity: .3; cursor: default; background: none; color: var(--muted); }
  #nav { display: flex; flex-direction: column; align-items: center; gap: 2px; }

  /* La pastille de recherche : un ovale avec une loupe, hors de l'accueil */
  #search-pill {
    width: 40px; height: 26px; border-radius: 13px; display: grid; place-items: center;
    color: var(--accent); background: var(--surface); border: 1.5px solid var(--accent);
    box-shadow: var(--shadow); transition: transform .15s ease;
  }
  #search-pill:hover { transform: scale(1.08); }
  #search-pill.loading { animation: pulse 1s ease-in-out infinite; }
  #search-pill[hidden] { display: none; }

  /* Onglets : un point, ou une longue pastille pour l'onglet actif */
  #pills { display: flex; flex-direction: column; align-items: center; gap: 4px; overflow-y: auto; scrollbar-width: none; padding-top: 8px; }
  .tab { position: relative; width: 46px; height: 30px; display: grid; place-items: center; cursor: pointer; }
  .tab.active { height: 56px; }
  .dot {
    width: 16px; height: 16px; border-radius: 8px; background: var(--muted); opacity: .55;
    transition: all .18s ease;
  }
  .tab:hover .dot { opacity: 1; width: 18px; height: 18px; border-radius: 9px; }
  .tab.active .dot, .tab.active:hover .dot { width: 16px; height: 46px; border-radius: 8px; background: var(--accent); opacity: 1; }
  .tab.loading .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  /* Petite croix rouge qui apparaît en haut de l'onglet survolé */
  .close {
    position: absolute; top: -4px; right: 4px; width: 16px; height: 16px; border-radius: 8px;
    display: grid; place-items: center; background: var(--danger); color: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
    opacity: 0; transform: scale(.6); pointer-events: none; transition: all .12s ease;
  }
  .tab:hover .close { opacity: 1; transform: scale(1); pointer-events: auto; }
  .close:hover { filter: brightness(1.1); }
  /* Onglet qui joue du son : un petit bouton fixe en bas à droite coupe ou remet le son
     (aussi : clic droit sur l'onglet, ou Ctrl+M). Un clic sur la pastille change d'onglet. */
  .mute {
    position: absolute; bottom: -3px; right: 3px; width: 16px; height: 16px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    border: 1px solid var(--line);
    opacity: .9; transition: all .12s ease;
  }
  .tab.muted .mute { opacity: 1; color: var(--text); }
  .mute:hover { opacity: 1; color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
  /* Onglet avec l'icône du site : la pastille est un peu plus grande et porte l'icône */
  .tab.has-icon { height: 38px; }
  .tab.has-icon.active { height: 66px; }
  .tab.has-icon .dot, .tab.has-icon:hover .dot {
    width: 30px; height: 30px; border-radius: 15px; opacity: 1; background: var(--line);
    display: grid; place-items: center;
  }
  .tab.has-icon.active .dot, .tab.has-icon.active:hover .dot {
    width: 32px; height: 58px; border-radius: 16px; background: var(--accent);
  }
  .tab.has-icon.muted .dot { opacity: .6; }
  .favicon {
    width: 20px; height: 20px; border-radius: 6px; background: #fff;
    display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
  }
  .favicon img { width: 16px; height: 16px; object-fit: contain; display: block; }
  /* Menu du clic droit sur un onglet : une petite bulle dans la colonne, la page reste visible */
  #ctx {
    position: fixed; left: 3px; width: 50px; display: none; z-index: 20; padding: 4px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  }
  #ctx.open { display: block; }
  #ctx button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%;
    padding: 6px 0; font-size: 10px; color: var(--muted); border-radius: 8px;
  }
  #ctx button:hover { background: var(--accent-soft); color: var(--text); }
  /* Barre à droite ou en haut (réglage « Position de la barre ») */
  body[data-pos="right"] #sidebar { left: auto; right: 0; }
  body[data-pos="right"] #overlay, body[data-pos="right"] #settings { left: 0; right: 56px; }
  body[data-pos="right"] #ctx { left: auto; right: 3px; }
  body[data-pos="top"] #sidebar {
    left: 0; right: 0; bottom: auto; width: auto; height: 44px; flex-direction: row;
    padding: 0 10px; gap: 6px; border-bottom: 1px solid var(--line);
  }
  body[data-pos="top"] #top, body[data-pos="top"] #middle { display: contents; }
  body[data-pos="top"] #nav { flex-direction: row; order: 1; gap: 2px; }
  body[data-pos="top"] #pills {
    flex-direction: row; order: 2; overflow-x: auto; overflow-y: hidden; padding: 5px 4px; gap: 4px;
    min-width: 0; flex: 0 1 auto; align-items: center;
  }
  body[data-pos="top"] #new-tab { order: 3; }
  body[data-pos="top"] #gear { order: 0; }
  body[data-pos="top"] #search-pill { display: none; }
  body[data-pos="top"] #overlay, body[data-pos="top"] #settings { left: 0; right: 0; top: 44px; }
  body[data-pos="top"] .tab, body[data-pos="top"] .tab.has-icon,
  body[data-pos="top"] .tab.active, body[data-pos="top"] .tab.has-icon.active { width: 34px; height: 34px; flex: none; }
  body[data-pos="top"] .tab.active, body[data-pos="top"] .tab.has-icon.active {
    width: auto; min-width: 150px; max-width: 340px; flex: 0 1 340px; display: flex; align-items: center;
    gap: 8px; padding: 0 12px 0 2px; border-radius: 17px; background: var(--accent-soft);
  }
  body[data-pos="top"] .tab.active .dot, body[data-pos="top"] .tab.active:hover .dot,
  body[data-pos="top"] .tab.has-icon.active .dot, body[data-pos="top"] .tab.has-icon.active:hover .dot {
    width: 28px; height: 28px; border-radius: 14px; background: var(--line); opacity: 1; flex: none;
    display: grid; place-items: center;
  }
  body[data-pos="top"] .tab.active:not(.has-icon) .dot { background: var(--accent); width: 12px; height: 12px; border-radius: 6px; margin: 0 8px 0 10px; }
  body[data-pos="top"] .tab.has-icon .dot, body[data-pos="top"] .tab.has-icon:hover .dot { width: 30px; height: 30px; }
  body[data-pos="top"] .tab .mute { bottom: -3px; right: -1px; }
  body[data-pos="top"] .tab.active .mute { position: static; margin-left: 2px; flex: none; }
  .ttl, .urlinput { flex: 1; min-width: 0; font-size: 13px; }
  .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  .urlinput { border: 0; outline: none; background: transparent; color: var(--text); font-family: inherit; user-select: text; }
  .tab.editing { background: var(--surface) !important; box-shadow: 0 0 0 1.5px var(--accent); }
  body[data-pos="top"] #ctx { top: 4px; width: auto; height: 36px; padding: 0 4px; }
  body[data-pos="top"] #ctx.open { display: flex; }
  body[data-pos="top"] #ctx button { flex-direction: row; gap: 6px; width: auto; height: 100%; padding: 0 10px; font-size: 12px; }
  /* Glisser-déposer */
  .tab.dragging { opacity: .6; transform: scale(1.15); cursor: grabbing; z-index: 2; }
  .tab.dragging .close, .tab.dragging .mute { display: none; }

  /* Barre de recherche ouverte par-dessus la page (la page est cachée pendant ce temps) */
  #overlay, #settings {
    position: fixed; left: 56px; right: 0; top: 0; bottom: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 0 24px;
  }
  body.bar #overlay, body.settings #settings { display: flex; }
  #overlay { justify-content: flex-start; padding-top: 22vh; }
  #bar {
    width: min(660px, 100%); height: 52px; border-radius: 26px;
    display: flex; align-items: center; gap: 6px; padding: 0 8px 0 20px;
    background: var(--surface); border: 1px solid var(--accent); box-shadow: var(--shadow);
  }
  #bar > svg { color: var(--muted); flex: none; }
  #input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 16px; padding: 0 6px; user-select: text;
  }
  #input::placeholder { color: var(--muted); }
  .icon { width: 34px; height: 34px; border-radius: 17px; color: var(--muted); font-size: 16px; flex: none; }
  .icon:hover { background: var(--accent-soft); color: var(--text); }
  #command-list {
    list-style: none; margin: 10px 0 0; padding: 6px; width: min(660px, 100%);
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  #command-list:empty { display: none; }
  #command-list li { display: flex; gap: 12px; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  #command-list li .name { color: var(--accent); min-width: 110px; font-weight: 600; }
  #command-list li .desc { color: var(--muted); }
  #command-list li.selected { background: var(--accent-soft); }
  #command-list li.selected .desc { color: var(--text); }
  #overlay .help { margin-top: 14px; color: var(--muted); font-size: 12px; }

  /* Paramètres */
  #settings form {
    width: min(460px, 100%); max-height: 100%; overflow-y: auto; padding: 24px 26px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    user-select: text;
  }
  #settings h2 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }
  #settings label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; }
  #settings input[type=text], #settings select {
    width: 100%; height: 38px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  #settings .choices { display: flex; gap: 6px; }
  #settings .choices button { flex: 1; height: 36px; border-radius: 10px; border: 1px solid var(--line); }
  #settings .choices button.on { border-color: var(--accent); background: var(--accent-soft); }
  #settings .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
  #settings .actions button { height: 38px; padding: 0 18px; border-radius: 19px; }
  #settings .primary { background: var(--accent); color: #fff; }
  #settings .update { margin-top: 20px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
  #settings [hidden] { display: none !important; }
  #settings .update h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  #settings .update .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  #settings .update .row span:first-child { color: var(--muted); }
  #settings .update .row b { font-weight: 600; }
  #settings .update .status { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 18px; }
  #settings .update .status.err { color: #d64545; }
  #settings .update .buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #settings .update button { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--line); }
  #settings .update button.primary { border-color: var(--accent); }
  #settings .update button:disabled { opacity: .5; cursor: default; }
  #settings .update .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 13px; }
  #gear { position: relative; }
  #gear.has-update::after {
    content: ''; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); border: 1.5px solid var(--bg);
  }
  #settings .about { margin-top: 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body data-pos="left">
  <nav id="sidebar" aria-label="Navigation">
    <div id="top">
      <button class="round" id="gear" title="Paramètres (Ctrl+,)" aria-label="Paramètres">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div id="nav">
        <button class="round" id="back" title="Page précédente (Alt+←)" aria-label="Page précédente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <button class="round" id="forward" title="Page suivante (Alt+→)" aria-label="Page suivante">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="round" id="home" title="Accueil" aria-label="Accueil">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>
        </button>
      </div>
    </div>
    <div id="middle">
      <button id="search-pill" hidden aria-label="Rechercher ou aller à une adresse (Ctrl+L)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div id="pills"></div>
      <button class="round" id="new-tab" aria-label="Nouvel onglet (Ctrl+T)">+</button>
    </div>
  </nav>

  <div id="overlay">
    <div id="bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="input" spellcheck="false" autocomplete="off"
             placeholder="Aller à, chercher, ou taper / pour une commande">
      <button class="icon" id="reload" title="Actualiser (F5)">&#8635;</button>
    </div>
    <ul id="command-list"></ul>
    <div class="help">Entrée pour valider · Échap pour revenir à la page</div>
  </div>

  <div id="ctx"></div>

  <div id="settings">
    <form id="settings-form">
      <h2>Paramètres</h2>
      <label for="s-name">Votre prénom (affiché sur l'accueil)</label>
      <input type="text" id="s-name" maxlength="40" autocomplete="off">
      <label for="s-engine">Moteur de recherche</label>
      <select id="s-engine">
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="qwant">Qwant</option>
        <option value="ecosia">Ecosia</option>
        <option value="google">Google</option>
        <option value="bing">Bing</option>
      </select>
      <label for="s-home">Adresse du bouton maison (vide = accueil Feather avec l'heure et la recherche)</label>
      <input type="text" id="s-home" placeholder="exemple.fr" autocomplete="off">
      <label>Thème</label>
      <div class="choices" id="s-theme">
        <button type="button" data-value="auto">Automatique</button>
        <button type="button" data-value="light">Clair</button>
        <button type="button" data-value="dark">Sombre</button>
      </div>
      <label>Position de la barre</label>
      <div class="choices" id="s-pos">
        <button type="button" data-value="left">Gauche</button>
        <button type="button" data-value="right">Droite</button>
        <button type="button" data-value="top">Haut</button>
      </div>
      <div class="update">
        <h3>Mise à jour</h3>
        <div class="row"><span>Version actuelle</span><b id="u-current"></b></div>
        <div class="row" id="u-new-row" hidden><span>Nouvelle version</span><b id="u-new"></b></div>
        <p class="status" id="u-status"></p>
        <div class="buttons">
          <button type="button" id="u-check">Rechercher une mise à jour</button>
          <button type="button" id="u-install" class="primary" hidden>Télécharger</button>
          <button type="button" id="u-restart" class="primary" hidden>Redémarrer pour mettre à jour</button>
          <button type="button" id="u-page" hidden>Voir la version</button>
        </div>
        <label class="check"><input type="checkbox" id="s-autoupdate"> Chercher une mise à jour à chaque démarrage</label>
      </div>
      <div class="actions">
        <button type="button" id="s-cancel">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
      <div class="about">Feather</div>
    </form>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));

  const COMMANDS = [
    { name: '/nouveau', desc: 'Ouvrir un nouvel onglet', run: () => send({ type: 'new_tab' }) },
    { name: '/fermer', desc: "Fermer l'onglet actuel", run: () => send({ type: 'close_tab', id: null }) },
    { name: '/accueil', desc: 'Aller à la page du bouton maison', run: () => send({ type: 'home' }) },
    { name: '/retour', desc: 'Page précédente', run: () => send({ type: 'back' }) },
    { name: '/suivant', desc: 'Page suivante', run: () => send({ type: 'forward' }) },
    { name: '/actualiser', desc: 'Recharger la page', run: () => send({ type: 'reload' }) },
    { name: '/parametres', desc: 'Ouvrir les paramètres', run: () => openSettings() },
  ];

  let state = { tabs: [], settings: {}, version: '', update: { state: 'idle' }, can_back: false, can_forward: false };
  let drag = null;          // onglet en cours de déplacement
  const badIcons = new Set(); // icônes introuvables : on garde le point gris
  let mode = null;          // null, 'bar' ou 'settings'
  let matches = [];
  let selected = 0;
  let draftTheme = 'auto';
  let draftPos = 'left';
  let editing = false;      // adresse de l'onglet actif en cours de modification (barre en haut)
  const isTop = () => (state.settings.bar_position || 'left') === 'top';
  const applyPos = (pos) => { document.body.dataset.pos = pos || 'left'; };

  const input = $('input');
  const activeTab = () => state.tabs.find((t) => t.active);
  const label = (t) => t.home ? 'Accueil' : (t.title || t.url);

  // Un panneau ouvert cache la page (Rust s'en charge).
  function setMode(next) {
    if (next === mode) return;
    const wasOpen = mode !== null;
    mode = next;
    document.body.classList.toggle('bar', mode === 'bar');
    document.body.classList.toggle('settings', mode === 'settings');
    if (wasOpen !== (mode !== null)) send({ type: 'expand', open: mode !== null });
  }

  let ctxTimer = 0;
  function closeTabMenu() { clearTimeout(ctxTimer); $('ctx').classList.remove('open'); }
  function openTabMenu(tab, ev) {
    const y = ev.clientY;
    const items = [];
    if (!tab.home) items.push([tab.muted ? SPEAKER_OFF : SPEAKER, tab.muted ? 'Son' : 'Muet', () => send({ type: 'toggle_mute', id: tab.id })]);
    items.push(['<svg width="12" height="12" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg>', 'Fermer', () => send({ type: 'close_tab', id: tab.id })]);
    const box = $('ctx');
    box.textContent = '';
    for (const [icon, text, run] of items) {
      const b = document.createElement('button');
      b.innerHTML = icon + '<span>' + text + '</span>';
      b.title = text === 'Muet' ? "Couper le son de l'onglet" : text === 'Son' ? 'Réactiver le son' : "Fermer l'onglet";
      b.addEventListener('click', (e) => { e.stopPropagation(); closeTabMenu(); run(); });
      box.appendChild(b);
    }
    if (mode === 'bar') closeBar(false);
    if (isTop()) {
      box.style.top = '';
      box.style.left = Math.max(4, Math.min(ev.clientX - 20, window.innerWidth - 150)) + 'px';
    } else {
      box.style.left = '';
      box.style.top = Math.max(4, Math.min(y - 20, window.innerHeight - 70 * items.length)) + 'px';
    }
    box.classList.add('open');
    clearTimeout(ctxTimer);
    ctxTimer = setTimeout(closeTabMenu, 4000);
  }
  $('ctx').addEventListener('pointerenter', () => clearTimeout(ctxTimer));
  $('ctx').addEventListener('pointerleave', () => { clearTimeout(ctxTimer); ctxTimer = setTimeout(closeTabMenu, 350); });
  document.addEventListener('pointerdown', (e) => { if (!$('ctx').contains(e.target)) closeTabMenu(); }, true);
  window.addEventListener('blur', closeTabMenu);
  // Boutons latéraux de la souris : précédent et suivant
  for (const type of ['mousedown', 'mouseup', 'auxclick']) {
    window.addEventListener(type, (e) => {
      if (e.button !== 3 && e.button !== 4) return;
      e.preventDefault();
      if (type === 'mouseup') send({ type: e.button === 3 ? 'back' : 'forward' });
    }, true);
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme || 'auto';
  }

  const SPEAKER = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/>' +
    '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const SPEAKER_OFF = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/>' +
    '<path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  function renderSidebar() {
    $('back').disabled = !state.can_back;
    $('forward').disabled = !state.can_forward;
    // Hors de l'accueil, la recherche se range dans la pastille au-dessus des onglets.
    const tab = activeTab();
    const pill = $('search-pill');
    pill.hidden = !tab || tab.home;
    pill.classList.toggle('loading', !!(tab && tab.loading));
    if (drag || (editing && document.querySelector('.urlinput'))) return; // on redessine les onglets à la fin du glisser-déposer

    const box = $('pills');
    box.textContent = '';
    for (const tab of state.tabs) {
      const el = document.createElement('div');
      const sound = tab.audible || tab.muted;
      const icon = tab.icon && !badIcons.has(tab.icon) ? tab.icon : null;
      el.className = 'tab' + (tab.active ? ' active' : '') + (tab.loading && !sound ? ' loading' : '') +
        (icon ? ' has-icon' : '') + (tab.muted ? ' muted' : '');
      el.dataset.id = tab.id;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', label(tab));
      el.title = label(tab); // bulle : le titre de la page
      el.innerHTML = '<span class="dot"></span>' +
        '<button class="close" aria-label="Fermer l\'onglet">' +
        '<svg width="8" height="8" viewBox="0 0 10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg></button>';
      if (icon) {
        const box = document.createElement('span');
        box.className = 'favicon';
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer'; // on ne dit pas d'où l'on vient
        img.alt = '';
        img.draggable = false;
        img.addEventListener('error', () => { badIcons.add(icon); renderSidebar(); });
        img.src = icon;
        box.appendChild(img);
        el.querySelector('.dot').appendChild(box);
      }
      if (tab.active && isTop()) {
        el.classList.toggle('editing', editing);
        if (editing) {
          const inp = document.createElement('input');
          inp.className = 'urlinput';
          inp.spellcheck = false;
          inp.autocomplete = 'off';
          inp.placeholder = 'Aller à, chercher, ou taper / pour une commande';
          inp.addEventListener('pointerdown', (e) => e.stopPropagation());
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              const text = inp.value.trim();
              stopEdit();
              const c = COMMANDS.find((c) => c.name === text.toLowerCase());
              if (c) c.run(); else if (text) send({ type: 'navigate', input: text });
              e.preventDefault();
            } else if (e.key === 'Escape') {
              stopEdit();
              send({ type: 'focus_page' });
              e.preventDefault();
            }
          });
          inp.addEventListener('blur', () => setTimeout(() => { if (editing) stopEdit(); }, 0));
          el.appendChild(inp);
        } else {
          const ttl = document.createElement('span');
          ttl.className = 'ttl';
          ttl.textContent = label(tab);
          el.appendChild(ttl);
        }
      }
      if (sound) {
        const mute = document.createElement('button');
        mute.className = 'mute';
        mute.title = tab.muted ? 'Remettre le son' : "Couper le son de l'onglet";
        mute.setAttribute('aria-label', mute.title);
        mute.innerHTML = tab.muted ? SPEAKER_OFF : SPEAKER;
        mute.addEventListener('pointerdown', (e) => e.stopPropagation());
        mute.addEventListener('click', (e) => { e.stopPropagation(); send({ type: 'toggle_mute', id: tab.id }); });
        el.appendChild(mute);
      }
      // Clic droit : menu de l'onglet
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); openTabMenu(tab, e); });
      el.querySelector('.close').addEventListener('pointerdown', (e) => e.stopPropagation());
      el.querySelector('.close').addEventListener('click', (e) => {
        e.stopPropagation();
        send({ type: 'close_tab', id: tab.id });
      });
      el.addEventListener('pointerdown', (e) => startDrag(e, el, tab));
      box.appendChild(el);
    }
  }

  // Barre en haut : l'adresse de l'onglet actif se modifie directement dans sa pastille.
  function startEdit(text) {
    const tab = activeTab();
    if (!isTop() || !tab) return false;
    editing = true;
    renderSidebar();
    const inp = document.querySelector('.tab.active .urlinput');
    if (!inp) { editing = false; return false; }
    inp.value = text || (tab.home ? '' : tab.url);
    inp.focus();
    if (!text) inp.select();
    return true;
  }
  function stopEdit() {
    if (!editing) return;
    editing = false;
    renderSidebar();
  }

  // Glisser-déposer : maintenir le clic sur un onglet pour le déplacer.
  function startDrag(e, el, tab) {
    if (e.button !== 0) return;
    drag = { el, tab, y: isTop() ? e.clientX : e.clientY, moved: false, onTitle: !!e.target.closest('.ttl') };
    el.setPointerCapture(e.pointerId);
  }
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const top = isTop();
    const c = top ? e.clientX : e.clientY;
    if (!drag.moved && Math.abs(c - drag.y) < 6) return;
    if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); drag.el.title = ''; }
    const box = $('pills');
    const others = [...box.children].filter((c) => c !== drag.el);
    const before = others.find((c) => {
      const r = c.getBoundingClientRect();
      return top ? c < r.left + r.width / 2 : c < r.top + r.height / 2;
    });
    if (before) { if (drag.el.nextSibling !== before) box.insertBefore(drag.el, before); }
    else if (box.lastChild !== drag.el) box.appendChild(drag.el);
  });
  const endDrag = () => {
    if (!drag) return;
    const { el, tab, moved, onTitle } = drag;
    drag = null;
    if (moved) {
      const index = [...$('pills').children].indexOf(el);
      send({ type: 'move_tab', id: tab.id, index });
    } else if (tab.active && onTitle && isTop()) {
      startEdit();
      return;
    } else {
      send({ type: 'activate_tab', id: tab.id });
    }
    renderSidebar();
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function renderCommands() {
    const q = input.value.trim().toLowerCase();
    matches = q.startsWith('/') ? COMMANDS.filter((c) => c.name.startsWith(q)) : [];
    if (selected >= matches.length) selected = 0;
    const ul = $('command-list');
    ul.textContent = '';
    matches.forEach((c, i) => {
      const li = document.createElement('li');
      if (i === selected) li.className = 'selected';
      li.innerHTML = '<span class="name"></span><span class="desc"></span>';
      li.querySelector('.name').textContent = c.name;
      li.querySelector('.desc').textContent = c.desc;
      li.addEventListener('mousedown', (e) => { e.preventDefault(); runCommand(c); });
      ul.appendChild(li);
    });
  }

  // Ouvre la barre par-dessus la page, avec l'adresse actuelle (ou un texte donné).
  function openBar(text) {
    if (isTop() && startEdit(text)) return;
    setMode('bar');
    const tab = activeTab();
    input.value = text || (tab && !tab.home ? tab.url : '');
    selected = 0;
    renderCommands();
    input.focus();
    if (!text) input.select();
  }

  function closeBar(focusPage) {
    if (mode !== 'bar') return;
    input.value = '';
    renderCommands();
    setMode(null);
    if (focusPage) send({ type: 'focus_page' });
  }

  function runCommand(c) {
    closeBar(c.name !== '/parametres');
    c.run();
  }

  function openSettings() {
    const s = state.settings;
    $('s-name').value = s.name || '';
    $('s-engine').value = s.search_engine || 'duckduckgo';
    $('s-home').value = s.home_page || '';
    draftTheme = s.theme || 'auto';
    draftPos = s.bar_position || 'left';
    $('s-autoupdate').checked = s.auto_update_check !== false;
    renderThemeChoices();
    renderPosChoices();
    renderUpdate();
    if (mode === 'bar') closeBar(false);
    setMode('settings');
    $('s-name').focus();
  }

  function closeSettings() {
    applyTheme(state.settings.theme);
    applyPos(state.settings.bar_position);
    setMode(null);
    send({ type: 'focus_page' });
  }

  function renderThemeChoices() {
    for (const b of $('s-theme').children) b.classList.toggle('on', b.dataset.value === draftTheme);
    applyTheme(draftTheme); // aperçu immédiat
  }

  function renderPosChoices() {
    for (const b of $('s-pos').children) b.classList.toggle('on', b.dataset.value === draftPos);
    applyPos(draftPos); // aperçu immédiat
  }

  // --- Barre ---
  input.addEventListener('blur', () => setTimeout(() => {
    if (mode === 'bar' && document.activeElement !== input) closeBar(false);
  }, 0));
  input.addEventListener('input', () => { selected = 0; renderCommands(); });
  input.addEventListener('keydown', (e) => {
    if (matches.length) {
      if (e.key === 'ArrowDown') { selected = (selected + 1) % matches.length; renderCommands(); e.preventDefault(); return; }
      if (e.key === 'ArrowUp') { selected = (selected - 1 + matches.length) % matches.length; renderCommands(); e.preventDefault(); return; }
      if (e.key === 'Enter') { runCommand(matches[selected]); e.preventDefault(); return; }
    }
    if (e.key === 'Enter') {
      const text = input.value.trim();
      if (text) { closeBar(false); send({ type: 'navigate', input: text }); }
      e.preventDefault();
    } else if (e.key === 'Escape') {
      closeBar(true);
    }
  });
  // Les boutons de la barre ne doivent pas lui faire perdre le focus.
  $('reload').addEventListener('mousedown', (e) => e.preventDefault());
  $('reload').addEventListener('click', () => { closeBar(true); send({ type: 'reload' }); });
  for (const id of ['back', 'forward', 'home']) {
    $(id).addEventListener('click', () => {
      if (mode === 'bar') closeBar(false);
      if (mode === 'settings') closeSettings();
      send({ type: id });
      send({ type: 'focus_page' });
    });
  }
  $('overlay').addEventListener('mousedown', (e) => {
    if (e.target === $('overlay')) { e.preventDefault(); closeBar(true); }
  });

  $('search-pill').addEventListener('click', () => openBar(''));
  $('gear').addEventListener('click', () => mode === 'settings' ? closeSettings() : openSettings());
  $('new-tab').addEventListener('click', () => send({ type: 'new_tab' }));

  // --- Paramètres ---
  for (const b of $('s-theme').children) {
    b.addEventListener('click', () => { draftTheme = b.dataset.value; renderThemeChoices(); });
  }
  for (const b of $('s-pos').children) {
    b.addEventListener('click', () => { draftPos = b.dataset.value; renderPosChoices(); });
  }
  $('s-cancel').addEventListener('click', closeSettings);
  $('settings-form').addEventListener('submit', (e) => {
    e.preventDefault();
    send({
      type: 'save_settings',
      settings: {
        name: $('s-name').value,
        search_engine: $('s-engine').value,
        home_page: $('s-home').value,
        theme: draftTheme,
        bar_position: draftPos,
        auto_update_check: $('s-autoupdate').checked,
      },
    });
    setMode(null);
    send({ type: 'focus_page' });
  });

  // --- Mise à jour ---
  function renderUpdate() {
    const u = state.update || { state: 'idle' };
    const info = u.info;
    const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' Mo';
    $('u-current').textContent = 'Feather ' + (state.version || '');
    $('u-new-row').hidden = !info;
    if (info) $('u-new').textContent = 'Feather ' + info.version;
    const canInstall = info && info.url;
    const messages = {
      idle: '',
      checking: 'Recherche en cours…',
      uptodate: 'Feather est à jour.',
      available: canInstall
        ? 'Une nouvelle version est disponible' + (info.size ? ' (' + mb(info.size) + ').' : '.')
        : 'Une nouvelle version est disponible, mais pas de téléchargement automatique sur ce système.',
      downloading: 'Téléchargement et installation…',
      ready: 'Mise à jour installée. Redémarrez Feather pour l\'utiliser.',
      error: u.message || 'Erreur.',
    };
    const st = $('u-status');
    st.textContent = messages[u.state] || '';
    st.classList.toggle('err', u.state === 'error');
    const busy = u.state === 'checking' || u.state === 'downloading';
    $('u-check').hidden = u.state === 'ready';
    $('u-check').disabled = busy;
    $('u-install').hidden = !(u.state === 'available' && canInstall);
    $('u-restart').hidden = u.state !== 'ready';
    $('u-page').hidden = !(u.state === 'available' && !canInstall);
    $('gear').classList.toggle('has-update', u.state === 'available' || u.state === 'ready' || u.state === 'downloading');
  }
  $('u-check').addEventListener('click', () => send({ type: 'check_update' }));
  $('u-install').addEventListener('click', () => send({ type: 'install_update' }));
  $('u-restart').addEventListener('click', () => send({ type: 'restart_update' }));
  $('u-page').addEventListener('click', () => { send({ type: 'open_release_page' }); closeSettings(); });

  // --- Raccourcis quand l'interface a le focus ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTabMenu();
    if (e.key === 'Escape' && mode === 'settings') { closeSettings(); return; }
    const k = e.key.toLowerCase();
    if (e.altKey && !e.ctrlKey && !e.metaKey && (k === 'arrowleft' || k === 'arrowright')) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      send({ type: k === 'arrowleft' ? 'back' : 'forward' });
      e.preventDefault();
      return;
    }
    if (e.metaKey && !e.ctrlKey && !e.altKey && (k === '[' || k === ']')) {
      send({ type: k === '[' ? 'back' : 'forward' });
      e.preventDefault();
      return;
    }
    if (k === 'f5') { send({ type: 'reload' }); e.preventDefault(); return; }
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    if (k === 'm' && e.ctrlKey && !e.metaKey) { const t = activeTab(); if (t) send({ type: 'toggle_mute', id: t.id }); }
    else if (k === 'l' || k === 'k') send({ type: 'focus_bar' });
    else if (k === 'r') send({ type: 'reload' });
    else if (k === 't') send({ type: 'new_tab' });
    else if (k === 'w') send({ type: 'close_tab', id: null });
    else if (k === ',') openSettings();
    else if (k === 'tab') {
      const i = state.tabs.findIndex((t) => t.active);
      const n = state.tabs.length;
      if (n) send({ type: 'activate_tab', id: state.tabs[(i + (e.shiftKey ? n - 1 : 1)) % n].id });
    } else return;
    e.preventDefault();
  });

  // --- Appelé par Rust ---
  window.navigateur = {
    setState(next) {
      state = next;
      if (mode !== 'settings') { applyTheme(state.settings.theme); applyPos(state.settings.bar_position); }
      renderSidebar();
      renderUpdate();
    },
    openBar,
    openSettings,
  };

  send({ type: 'ready' });
})();
</script>
</body>
</html>
