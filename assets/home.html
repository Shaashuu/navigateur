<!doctype html>
<html lang="fr" data-theme="{{THEME}}" data-motion="{{MOTION}}">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<style>
  /* Refonte « Plume » : papier clair, une feuille blanche au centre, titre à empattements. */
  :root { --bg: #efede7; --surface: #ffffff; --field: #f4f3ef; --tile: #f1f0ec; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e0da; --accent: #5b5bd6; --shadow: 0 6px 24px rgba(0,0,0,.08); }
  /* Une seule palette sombre : le script ci-dessous choisit le mode (data-mode)
     selon le réglage et, en « automatique », selon le système. */
  :root[data-mode="dark"] { --bg: #121215; --surface: #1c1c20; --field: #24242a; --tile: #2a2a30; --text: #ececef; --muted: #9a9aa2; --line: #303036; --accent: #8f8ff5; --shadow: 0 6px 24px rgba(0,0,0,.45); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface); color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 0; padding: clamp(48px, 16vh, 140px) 24px 60px; user-select: none; overflow-y: auto;
  }
  #date { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  #date::first-letter { text-transform: uppercase; }
  #hello { margin: 8px 0 0; font-family: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
    font-size: clamp(32px, 5vw, 44px); font-weight: 600; letter-spacing: -.01em; text-align: center; }
  #search {
    margin-top: 28px; width: min(620px, 100%); height: 56px; border-radius: 28px;
    display: flex; align-items: center; gap: 12px; padding: 0 22px;
    background: var(--field); border: 1px solid var(--line);
  }
  #search:focus-within { border-color: var(--accent); background: var(--surface); box-shadow: var(--shadow); }
  #search svg { flex: none; color: var(--muted); }
  #q {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 17px;
  }
  #q::placeholder { color: var(--muted); }
  #favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 14px 10px; margin-top: 30px; width: min(620px, 100%); }
  .fav { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 2px;
    border-radius: 14px; color: var(--text); text-decoration: none; }
  .fi { width: 56px; height: 56px; border-radius: 16px; background: var(--tile);
    display: grid; place-items: center; font-weight: 700; font-size: 20px; color: var(--text); overflow: hidden; transition: transform .12s; }
  .fav:hover .fi { transform: translateY(-2px); box-shadow: var(--shadow); }
  /* Vignette qu'on déplace : soulevée, penchée, elle suit la souris (comme les onglets). */
  #favs { position: relative; }
  .fav { position: relative; touch-action: none; -webkit-user-drag: none; }
  .fav.dragging { z-index: 2; cursor: grabbing; }
  .fav.dragging .fi { transform: none; box-shadow: 0 12px 28px rgba(0,0,0,.24); }
  [data-motion="off"] .fav.dragging, [data-motion="reduced"] .fav.dragging { opacity: .6; }
  .fi img { width: 28px; height: 28px; object-fit: contain; }
  .ft { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent { width: min(620px, 100%); margin-top: 30px; }
  #recent h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .rcs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rc { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
    color: var(--text); text-decoration: none; min-width: 0; }
  .rc:hover { border-color: var(--accent); }
  .rt { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rh { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { position: fixed; bottom: 16px; color: var(--muted); font-size: 12px; opacity: .8; }
  kbd { font: inherit; border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; }
  @media (max-height: 560px) { #hint { display: none; } }

  /* Arrivée en cascade (réglage « Animations ») : la date, le bonjour, la
     recherche puis les vignettes, chacune avec un petit rebond. Rien qu'en
     CSS, joué une fois à l'ouverture de la page. */
  :root { --snap: cubic-bezier(.3, 1.25, .5, 1); --bounce: cubic-bezier(.34, 1.56, .64, 1); }
  @supports (animation-timing-function: linear(0, 1)) {
    :root {
      --snap: linear(0, 0.036, 0.123, 0.236, 0.359, 0.48, 0.592, 0.691, 0.774, 0.842, 0.896, 0.937, 0.968, 0.989, 1.004, 1.013, 1.018, 1.02, 1.02, 1.018, 1.016, 1.014, 1.011, 1.009, 1.007, 1.005, 1.004, 1.002, 1.002, 1.001, 1, 1, 1);
      --bounce: linear(0, 0.077, 0.261, 0.493, 0.723, 0.919, 1.064, 1.153, 1.191, 1.19, 1.162, 1.119, 1.073, 1.032, 0.999, 0.977, 0.965, 0.962, 0.966, 0.973, 0.982, 0.99, 0.998, 1.003, 1.006, 1.007, 1.007, 1.006, 1.004, 1.003, 1.001, 1, 1);
    }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.96); } }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.7); } }
  @keyframes appear { from { opacity: 0; } }
  [data-motion="full"] #date { animation: rise .45s var(--snap) .04s both; }
  [data-motion="full"] #hello { animation: rise .45s var(--snap) .09s both; }
  [data-motion="full"] #search { animation: rise .45s var(--snap) .14s both; }
  [data-motion="full"] .fav, [data-motion="full"] .rc { animation: pop .78s var(--bounce) both; animation-delay: calc(.2s + var(--i, 0) * 35ms); }
  [data-motion="reduced"] #date, [data-motion="reduced"] #hello, [data-motion="reduced"] #search,
  [data-motion="reduced"] .fav, [data-motion="reduced"] .rc { animation: appear .14s linear both; }
  @media (prefers-reduced-motion: reduce) {
    [data-motion="full"] #date, [data-motion="full"] #hello, [data-motion="full"] #search,
    [data-motion="full"] .fav, [data-motion="full"] .rc { animation: appear .14s linear both; }
  }
</style>
<script>
  // Thème : « auto » suit le système, et change avec lui.
  (() => {
    const root = document.documentElement;
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const t = root.dataset.theme;
      root.dataset.mode = t === 'dark' || (t !== 'light' && dark.matches) ? 'dark' : 'light';
    };
    apply();
    if (dark.addEventListener) dark.addEventListener('change', apply); else dark.addListener(apply);
  })();
</script>
</head>
<body>
  <div id="date"></div>
  <h1 id="hello" data-name="{{NAME}}"></h1>
  <form id="search" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" spellcheck="false" autofocus placeholder="Aller à, chercher, ou taper / pour une commande">
  </form>
  {{BOOKMARKS}}
  {{RECENT}}
  <div id="hint"><kbd>/</kbd> dans la barre pour les commandes · <kbd>Ctrl</kbd>+<kbd>T</kbd> nouvel onglet</div>
<script>
  const hello = document.getElementById('hello');
  const name = hello.dataset.name;
  const q = document.getElementById('q');
  const send = (msg) => window.ipc && window.ipc.postMessage(JSON.stringify(msg));

  function tick() {
    const now = new Date();
    document.getElementById('date').textContent =
      now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · ' +
      now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const h = now.getHours();
    const word = h < 5 ? 'Bonne nuit' : h >= 18 ? 'Bonsoir' : 'Bonjour';
    hello.textContent = name ? `${word}, ${name}` : word;
  }
  tick();
  setInterval(tick, 1000);

  // Appelé par Rust pour Ctrl+L.
  window.focusSearch = () => { q.focus(); q.select(); };

  // Ce qui est tapé passe dans la barre de l'interface : « / » pour ses
  // commandes, sinon pour les suggestions (favoris, historique, moteur).
  q.addEventListener('input', () => {
    if (q.value.trim()) { send({ open_bar: q.value }); q.value = ''; }
  });
  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (text) send({ navigate: text });
  });
  window.addEventListener('load', () => q.focus());
  // Place de chaque vignette dans la cascade d'arrivée (voir le CSS).
  document.querySelectorAll('.fav, .rc').forEach((el, i) => el.style.setProperty('--i', String(Math.min(i, 16))));
  // Glisser-déposer des vignettes de favoris : maintenir le clic et déplacer.
  // Les autres vignettes s'écartent en glissant (FLIP, comme les onglets) ;
  // seuls transform et opacité bougent, rien ne tourne une fois posé.
  const favs = document.getElementById('favs');
  if (favs) {
    const root = document.documentElement;
    const full = () => root.dataset.motion === 'full' && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const curve = (name) => getComputedStyle(root).getPropertyValue(name).trim() || 'ease-out';
    const lift = (dx, dy) => `translate(${dx}px, ${dy}px) translateY(-3px) scale(1.06) rotate(-2.5deg)`;
    let drag = null;
    let swallow = false; // le clic qui suit un déplacement n'ouvre pas le site
    favs.querySelectorAll('.fav, .fav img').forEach((el) => { el.draggable = false; });
    favs.addEventListener('dragstart', (e) => e.preventDefault());
    favs.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.fav');
      if (!el || e.button !== 0) return;
      const r = el.getBoundingClientRect();
      drag = { el, x: e.clientX, y: e.clientY, gx: e.clientX - r.left, gy: e.clientY - r.top, moved: false };
      el.setPointerCapture(e.pointerId);
    });
    favs.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      const el = drag.el;
      if (!drag.moved) {
        drag.moved = true;
        // L'arrivée en cascade est finie : on la retire pour que le transform écrit ici s'applique.
        favs.querySelectorAll('.fav').forEach((f) => { f.style.animation = 'none'; });
        el.classList.add('dragging');
      }
      // Vignette sous le pointeur : on se place avant elle en remontant, après en descendant.
      // Cases mesurées sans les transform (offset*) : une vignette encore en train de
      // glisser vers sa nouvelle case ne doit pas être prise pour celle d'avant.
      const tiles = [...favs.querySelectorAll('.fav')];
      const box = favs.getBoundingClientRect();
      const px = e.clientX - box.left, py = e.clientY - box.top;
      const over = tiles.find((t) => t !== el && px >= t.offsetLeft && px <= t.offsetLeft + t.offsetWidth
        && py >= t.offsetTop && py <= t.offsetTop + t.offsetHeight);
      if (over) {
        const others = tiles.filter((t) => t !== el);
        const was = full() ? new Map(others.map((t) => [t, t.getBoundingClientRect()])) : null;
        favs.insertBefore(el, tiles.indexOf(over) < tiles.indexOf(el) ? over : over.nextSibling);
        if (was) {
          for (const [t, r] of was) {
            const n = t.getBoundingClientRect();
            const dx = r.left - n.left, dy = r.top - n.top;
            if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) {
              t.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 360, easing: curve('--snap') });
            }
          }
        }
      }
      if (full()) {
        el.style.transform = '';
        const r = el.getBoundingClientRect();
        el.style.transform = lift(e.clientX - drag.gx - r.left, e.clientY - drag.gy - r.top);
      }
    });
    const end = () => {
      if (!drag) return;
      const { el, moved } = drag;
      drag = null;
      if (!moved) return;
      swallow = true;
      setTimeout(() => { swallow = false; }, 0);
      el.classList.remove('dragging');
      // La vignette retombe dans sa case, avec un petit rebond.
      const from = el.style.transform;
      el.style.transform = '';
      if (from && full()) el.animate([{ transform: from }, { transform: 'none' }], { duration: 520, easing: curve('--bounce') });
      send({ reorder_bookmarks: [...favs.querySelectorAll('.fav')].map((f) => f.getAttribute('href')) });
    };
    favs.addEventListener('pointerup', end);
    favs.addEventListener('pointercancel', end);
    favs.addEventListener('click', (e) => { if (swallow) { e.preventDefault(); e.stopPropagation(); swallow = false; } }, true);
  }
  // Favori dont l'icône ne charge pas : on montre l'initiale du site.
  document.querySelectorAll('.fi img').forEach((img) => img.addEventListener('error', () => {
    img.parentNode.textContent = (img.closest('.fav').title || '?').charAt(0).toUpperCase();
  }));
</script>
</body>
</html>
