<!doctype html>
<html lang="fr" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<style>
  :root { --bg: #f4f3ef; --surface: #ffffff; --text: #1d1d1f; --muted: #8a8a8e; --line: #e2e0da; --accent: #5b5bd6; --shadow: 0 6px 24px rgba(0,0,0,.08); }
  :root[data-theme="dark"] { --bg: #17171a; --surface: #222226; --text: #ececef; --muted: #7d7d85; --line: #34343a; --accent: #8f8ff5; --shadow: 0 6px 24px rgba(0,0,0,.45); }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] { --bg: #17171a; --surface: #222226; --text: #ececef; --muted: #7d7d85; --line: #34343a; --accent: #8f8ff5; --shadow: 0 6px 24px rgba(0,0,0,.45); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 0 24px; user-select: none;
  }
  #clock { font-size: clamp(56px, 10vw, 112px); font-weight: 200; letter-spacing: 3px; font-variant-numeric: tabular-nums; line-height: 1; }
  #hello { font-size: 20px; margin-top: 6px; }
  #date { color: var(--muted); font-size: 14px; }
  #date::first-letter { text-transform: uppercase; }
  #search {
    margin-top: 28px; width: min(620px, 100%); height: 52px; border-radius: 26px;
    display: flex; align-items: center; gap: 12px; padding: 0 22px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  #search:focus-within { border-color: var(--accent); }
  #search svg { flex: none; color: var(--muted); }
  #q {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 16px;
  }
  #q::placeholder { color: var(--muted); }
  #hint { position: fixed; bottom: 18px; color: var(--muted); font-size: 12px; opacity: .8; }
  kbd { font: inherit; border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
  <div id="clock">--:--</div>
  <div id="hello" data-name="{{NAME}}"></div>
  <div id="date"></div>
  <form id="search" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" spellcheck="false" autofocus placeholder="Aller à, chercher, ou taper / pour une commande">
  </form>
  <div id="hint"><kbd>/</kbd> dans la barre pour les commandes · <kbd>Ctrl</kbd>+<kbd>T</kbd> nouvel onglet</div>
<script>
  const hello = document.getElementById('hello');
  const name = hello.dataset.name;
  const q = document.getElementById('q');
  const send = (msg) => window.ipc && window.ipc.postMessage(JSON.stringify(msg));

  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const h = now.getHours();
    const word = h >= 18 || h < 5 ? 'Bonsoir' : 'Bonjour';
    hello.textContent = name ? `${word} ${name}` : word;
  }
  tick();
  setInterval(tick, 1000);

  // Appelé par Rust pour Ctrl+L.
  window.focusSearch = () => { q.focus(); q.select(); };

  // « / » ouvre la liste des commandes de l'interface.
  q.addEventListener('input', () => {
    if (q.value.startsWith('/')) { send({ open_bar: q.value }); q.value = ''; }
  });
  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (text) send({ navigate: text });
  });
  window.addEventListener('load', () => q.focus());
</script>
</body>
</html>
