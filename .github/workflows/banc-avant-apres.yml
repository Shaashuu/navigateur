name: Banc avant-après
on:
  push:
    branches: [banc-avant-apres]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Construire 0.3.4
        run: cargo build --release
      - name: Construire 0.3.3 (avec l'ouverture des adresses au lancement)
        shell: bash
        run: |
          git worktree add ../avant 20130a4
          cd ../avant
          git apply "$GITHUB_WORKSPACE/outils/lancement-0.3.3.patch"
          cargo build --release
      - name: Index plein
        run: python outils/remplir-index.py contenu-plein.json
      - name: Comparer
        shell: pwsh
        run: ./outils/banc-avant-apres.ps1 -Avant ../avant/target/release/feather.exe -Apres target/release/feather.exe -Index contenu-plein.json
