# Diagnostic des extensions sur un vrai Mac (voir outils/sonde-extensions.m).
name: Sonde des extensions

permissions:
  contents: write

on:
  push:
    branches: [sonde-extensions]
  workflow_dispatch:

jobs:
  sonde:
    # Machine Intel : les Apple Silicon de GitHub restent souvent en file d'attente.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - run: sw_vers
      - name: Télécharger Proton Pass et uBlock Origin Lite
        run: |
          mkdir -p ext
          for pair in protonpass:ghmbeldphafepmbegfdlkpapadhbakde ublock:ddkjiahejlhfcafbddmgiahcphecmpfh; do
            n=${pair%%:*}; id=${pair##*:}
            curl -sSL --fail -o "ext/$n.crx" "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=138.0&acceptformat=crx2,crx3&x=id%3D$id%26uc"
            mkdir -p "ext/$n"
            (cd "ext/$n" && unzip -q -o "../$n.crx") || true
            echo "== $n"; ls "ext/$n"; head -c 1500 "ext/$n/manifest.json"; echo
          done
      # Arrière-plan classique enveloppé : son erreur est notée dans le stockage de
      # l'extension (WebKit dit seulement « le chargement a échoué »), lu par une
      # petite page ajoutée (sonde-page.html). Deux copies : « protonpass »
      # (erreur seulement) et « protonpass2 » (écoutes webRequest neutralisées).
      - name: Envelopper l'arrière-plan de Proton Pass
        run: |
          cp -R ext/protonpass ext/protonpass2
          for n in protonpass protonpass2; do
            cd ext/$n
            if [ $n = protonpass2 ]; then neutre=1; else neutre=0; fi
            cat > sonde-bg.js <<JS
          const NEUTRE = $neutre;
          JS
            cat >> sonde-bg.js <<'JS'
          const api = globalThis.browser || globalThis.chrome;
          const log = [];
          const note = (m) => { log.push(String(m)); try { api.storage.local.set({ __bgerr: log.join('\n') }); } catch (e) {} };
          self.addEventListener('error', (e) => note('error ' + e.message + ' @' + e.filename + ':' + e.lineno));
          self.addEventListener('unhandledrejection', (e) => note('rejet ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
          const c = globalThis.chrome || {};
          note('chrome=' + typeof globalThis.chrome + ' browser=' + typeof globalThis.browser + ' webRequest=' + typeof c.webRequest + ' offscreen=' + typeof c.offscreen + ' webNavigation=' + typeof c.webNavigation + ' scripting=' + typeof c.scripting + ' alarms=' + typeof c.alarms);
          if (c.webRequest) {
            for (const k of Object.keys(c.webRequest)) {
              const ev = c.webRequest[k];
              if (!ev || typeof ev.addListener !== 'function') continue;
              const add = ev.addListener.bind(ev);
              ev.addListener = (...a) => { try { return add(...a); } catch (e) { note('webRequest.' + k + ' : ' + e); if (!NEUTRE) throw e; } };
            }
          }
          try { importScripts('background.js'); note('import ok'); } catch (e) { note('throw ' + (e && (e.stack || e.message) || e)); }
          JS
            cat > sonde-page.html <<'HTML'
          <!doctype html><meta charset="utf-8"><pre id="out">…</pre><script src="sonde-page.js"></script>
          HTML
            cat > sonde-page.js <<'JS'
          const api = globalThis.browser || globalThis.chrome;
          api.storage.local.get('__bgerr').then((r) => { document.getElementById('out').textContent = 'BG: ' + (r.__bgerr || '(rien)'); },
            (e) => { document.getElementById('out').textContent = 'stockage illisible : ' + e; });
          JS
            python3 - <<'PY'
          import json
          m = json.load(open('manifest.json'))
          m['background']['service_worker'] = 'sonde-bg.js'
          json.dump(m, open('manifest.json', 'w'), indent=1)
          PY
            cd ../..
          done
      # Une vraie application (identifiant de bundle), comme Feather.
      - name: Compiler la sonde
        run: |
          mkdir -p Sonde.app/Contents/MacOS
          clang -fobjc-arc -mmacosx-version-min=15.4 -framework Cocoa -framework WebKit outils/sonde-extensions.m -o Sonde.app/Contents/MacOS/sonde
          sed -e 's/<string>feather<\/string>/<string>sonde<\/string>/' packaging/Info.plist > Sonde.app/Contents/Info.plist
          sed -i '' -e 's/app.feather.browser/app.feather.sonde/' Sonde.app/Contents/Info.plist || true
          cat Sonde.app/Contents/Info.plist
          codesign -s - --force Sonde.app || true
      - name: Proton Pass
        timeout-minutes: 3
        run: Sonde.app/Contents/MacOS/sonde ext/protonpass protonpass sortie 2>&1 || true
      - name: Proton Pass, écoutes webRequest neutralisées
        timeout-minutes: 3
        run: Sonde.app/Contents/MacOS/sonde ext/protonpass2 protonpass2 sortie 2>&1 || true
      - name: uBlock Origin Lite
        timeout-minutes: 3
        run: Sonde.app/Contents/MacOS/sonde ext/ublock ublock sortie 2>&1 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sonde
          path: sortie
      # Les captures sur une branche à part (lisibles sans télécharger l'archive).
      - name: Publier les captures
        if: always()
        run: |
          git config user.name sonde; git config user.email sonde@users.noreply.github.com
          git checkout --orphan sonde-resultats
          git rm -rfq --cached . >/dev/null
          git add -f sortie
          git commit -qm "Résultats de la sonde" && git push -fq origin sonde-resultats
