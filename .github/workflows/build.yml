name: Construire

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette à publier (par exemple v0.1.0), vide pour ne rien publier"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: Copy-Item target/release/feather.exe Feather-0.1.3-windows.exe
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Feather-0.1.3-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Construire pour Apple Silicon et Intel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Créer l'application et le .dmg
        run: |
          mkdir -p dmg/Feather.app/Contents/MacOS
          lipo -create -output dmg/Feather.app/Contents/MacOS/feather \
            target/aarch64-apple-darwin/release/feather \
            target/x86_64-apple-darwin/release/feather
          cp packaging/Info.plist dmg/Feather.app/Contents/Info.plist
          mkdir -p Feather.iconset dmg/Feather.app/Contents/Resources
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/feather-1024.png --out Feather.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) packaging/feather-1024.png --out Feather.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns Feather.iconset -o dmg/Feather.app/Contents/Resources/Feather.icns
          codesign --force --deep --sign - dmg/Feather.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Feather -srcfolder dmg -ov -format UDZO Feather-0.1.3-macos.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: Feather-0.1.3-macos.dmg

  publier:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: fichiers/*
