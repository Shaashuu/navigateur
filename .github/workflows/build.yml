name: Construire

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette à publier (par exemple v0.1.0), vide pour ne rien publier"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      # Banc de Feather : mémoire sur quelques sites, temps de démarrage, et
      # Proton Pass et uBlock Origin Lite (chargement, page sans erreur),
      # affichés dans le résumé de l'exécution. Un écart avec
      # outils/banc-reference.txt donne une alerte ; jamais d'échec de la
      # compilation ni de la publication.
      - name: Banc (mémoire, démarrage, extensions)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./outils/banc-memoire.ps1 -Programme target/release/feather.exe -Extensions
      # La version vient de Cargo.toml : elle n'est plus recopiée à la main ici.
      - name: Nommer le fichier avec la version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp target/release/feather.exe "Feather-$version-windows.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Feather-*-windows.exe

  macos:
    # Machine Intel : les machines Apple Silicon de GitHub sont souvent saturées,
    # et celle-ci construit aussi la version Apple Silicon (fichier universel).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Construire pour Apple Silicon et Intel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      # Même banc que sous Windows (voir plus haut).
      - name: Banc (mémoire, démarrage, extensions)
        continue-on-error: true
        timeout-minutes: 10
        run: bash outils/banc-memoire.sh --extensions target/x86_64-apple-darwin/release/feather
      - name: Créer l'application et le .dmg
        run: |
          mkdir -p dmg/Feather.app/Contents/MacOS
          lipo -create -output dmg/Feather.app/Contents/MacOS/feather \
            target/aarch64-apple-darwin/release/feather \
            target/x86_64-apple-darwin/release/feather
          cp packaging/Info.plist dmg/Feather.app/Contents/Info.plist
          mkdir -p Feather.iconset dmg/Feather.app/Contents/Resources
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/feather-1024.png --out Feather.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) packaging/feather-1024.png --out Feather.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns Feather.iconset -o dmg/Feather.app/Contents/Resources/Feather.icns
          codesign --force --deep --sign - dmg/Feather.app
          ln -s /Applications dmg/Applications
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          hdiutil create -volname Feather -srcfolder dmg -ov -format UDZO "Feather-$version-macos.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: Feather-*-macos.dmg

  publier:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: fichiers
          merge-multiple: true
      # Signature de chaque fichier avec la clé du secret FEATHER_SIGNATURE (voir
      # outils/cle-signature.py) : Feather refuse une mise à jour sans signature
      # valide. Le texte signé est le nom du fichier (qui porte la version), un
      # saut de ligne, puis son empreinte SHA-256 (voir `signed_message` dans
      # src/update.rs). Sans le secret, rien n'est publié.
      - name: Signer les fichiers
        env:
          FEATHER_SIGNATURE: ${{ secrets.FEATHER_SIGNATURE }}
        run: |
          if [ -z "$FEATHER_SIGNATURE" ]; then
            echo "::error::Le secret FEATHER_SIGNATURE manque : publication refusée sans signature."
            exit 1
          fi
          umask 077
          # Graine de 32 octets → clé PEM pour openssl (en-tête PKCS#8 d'une clé Ed25519).
          { printf 'MC4CAQAwBQYDK2VwBCIEIA==' | base64 -d; printf '%s' "$FEATHER_SIGNATURE" | base64 -d; } > "$RUNNER_TEMP/cle.der"
          openssl pkey -inform DER -in "$RUNNER_TEMP/cle.der" -out "$RUNNER_TEMP/cle.pem"
          rm -f "$RUNNER_TEMP/cle.der"
          for f in fichiers/Feather-*; do
            printf '%s\n%s' "$(basename "$f")" "$(openssl dgst -sha256 -r "$f" | cut -d' ' -f1)" > "$RUNNER_TEMP/message"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/cle.pem" -rawin -in "$RUNNER_TEMP/message" -out "$RUNNER_TEMP/sig"
            base64 -w0 "$RUNNER_TEMP/sig" > "$f.sig"
            echo "signé : $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/cle.pem" "$RUNNER_TEMP/message" "$RUNNER_TEMP/sig"
      # Notes de version : le paragraphe « Nouveau en x.y.z » du README.
      - name: Préparer les notes de version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          awk -v t="- **Nouveau en $version** :" '
            index($0, t) == 1 { dedans = 1; sub(/^- /, ""); print; next }
            dedans && /^  / { sub(/^  /, ""); print; next }
            dedans { exit }
          ' README.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          # Avec le secret RELEASES_TOKEN, la release va dans le dépôt public
          # feather-releases, d'où Feather lit ses mises à jour.
          repository: ${{ secrets.RELEASES_TOKEN != '' && 'Shaashuu/feather-releases' || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN != '' && secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ secrets.RELEASES_TOKEN != '' && 'main' || github.sha }}
          body_path: notes.md
          files: fichiers/*
