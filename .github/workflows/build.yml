name: Construire

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: Copy-Item target/release/navigateur.exe Navigateur-0.1-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Navigateur-0.1-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Construire pour Apple Silicon et Intel
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Créer l'application et le .dmg
        run: |
          mkdir -p dmg/Navigateur.app/Contents/MacOS
          lipo -create -output dmg/Navigateur.app/Contents/MacOS/navigateur \
            target/aarch64-apple-darwin/release/navigateur \
            target/x86_64-apple-darwin/release/navigateur
          cp packaging/Info.plist dmg/Navigateur.app/Contents/Info.plist
          codesign --force --deep --sign - dmg/Navigateur.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Navigateur -srcfolder dmg -ov -format UDZO Navigateur-0.1-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Navigateur-0.1-macos.dmg

  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: fichiers/*
